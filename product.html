
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات سایت | SN FORGE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #0b0b16;
            color: #f5f3ff;
            font-family: Tahoma, Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
        }

        .product-box {
            background: #151528;
            border: 1px solid #292943;
            border-radius: 18px;
            padding: 25px;
        }

        .product-image {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 14px;
        }

        h1 {
            color: #a78bfa;
            margin-top: 25px;
        }

        .description {
            color: #c4c4d8;
            line-height: 2;
        }

        .price {
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            margin: 25px 0;
        }

        .buy-btn, .back-btn {
            display: inline-block;
            padding: 13px 22px;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            margin: 7px 0;
        }

        .buy-btn {
            background: #8b5cf6;
            color: white;
        }

        .back-btn {
            background: #292943;
            color: white;
        }

        .buy-btn:hover, .back-btn:hover {
            opacity: 0.85;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .product-box {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="product-box">

            <img id="productImage" class="product-image" src="" alt="تصویر سایت">

            <h1 id="productName">نام سایت</h1>

            <p id="productDescription" class="description"></p>

            <div id="productPrice" class="price"></div>

            <button class="buy-btn" onclick="alert('درگاه پرداخت هنوز راه‌اندازی نشده است.')">
                خرید آنلاین
            </button>

            <br>

            <a href="index.html#sites" class="back-btn">
                بازگشت به سایت‌ها
            </a>

        </div>
    </main>

    <script src="product.js"></script>
</body>
</html>
